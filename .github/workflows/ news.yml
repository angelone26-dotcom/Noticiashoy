
name: Actualizar noticias

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news.yml"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Descargar y procesar noticias
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import html
          import datetime
          import re
          import xml.etree.ElementTree as ET

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36"
          )
          POR_FUENTE = 8

          PAISES = [
              {
                  "id": "uy",
                  "nombre": "🇺🇾 Uruguay",
                  "fuentes": [
                      {
                          "n": "Montevideo Portal",
                          "f": "https://www.montevideo.com.uy/anxml.aspx?58"
                      },
                      {
                          "n": "El Observador",
                          "f": "https://www.elobservador.com.uy/rss/pages/home.xml"
                      },
                      {
                          "n": "la diaria",
                          "f": "https://ladiaria.com.uy/feeds/articulos"
                      },
                      {
                          "n": "Teledoce",
                          "f": "https://www.teledoce.com/feed/"
                      }
                  ]
              },
              {
                  "id": "ar",
                  "nombre": "🇦🇷 Argentina",
                  "fuentes": [
                      {
                          "n": "Clarín",
                          "f": "https://www.clarin.com/rss/lo-ultimo/"
                      },
                      {
                          "n": "La Nación",
                          "f": "https://www.lanacion.com.ar/arc/outboundfeeds/rss/?outputType=xml"
                      },
                      {
                          "n": "Página/12",
                          "f": "https://www.pagina12.com.ar/arc/outboundfeeds/rss/portada"
                      }
                  ]
              },
              {
                  "id": "br",
                  "nombre": "🇧🇷 Brasil (traducido)",
                  "fuentes": [
                      {
                          "n": "G1",
                          "f": "https://g1.globo.com/rss/g1/",
                          "tr": "pt"
                      },
                      {
                          "n": "Folha de S.Paulo",
                          "f": "https://feeds.folha.uol.com.br/emcimadahora/rss091.xml",
                          "tr": "pt"
                      },
                      {
                          "n": "UOL",
                          "f": "http://rss.home.uol.com.br/index.xml",
                          "tr": "pt"
                      }
                  ]
              },
              {
                  "id": "es",
                  "nombre": "🇪🇸 España",
                  "fuentes": [
                      {
                          "n": "El País (España)",
                          "f": "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada"
                      },
                      {
                          "n": "BBC Mundo",
                          "f": "https://feeds.bbci.co.uk/mundo/rss.xml"
                      }
                  ]
              },
              {
                  "id": "us",
                  "nombre": "🇺🇸 Estados Unidos (traducido)",
                  "fuentes": [
                      {
                          "n": "The New York Times",
                          "f": "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml",
                          "tr": "en"
                      },
                      {
                          "n": "NPR",
                          "f": "https://feeds.npr.org/1001/rss.xml",
                          "tr": "en"
                      }
                  ]
              }
          ]

          def get(url, timeout=25):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, */*"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def local(tag):
              return tag.rsplit("}", 1)[-1].lower()

          def child_text(element, names):
              for child in element.iter():
                  if local(child.tag) in names:
                      value = "".join(child.itertext()).strip()
                      if value:
                          return html.unescape(value)
              return ""

          def find_image(element):
              # Busca imágenes declaradas como media, thumbnail o enclosure.
              for child in element.iter():
                  tag = local(child.tag)
                  url = (
                      child.attrib.get("url")
                      or child.attrib.get("href")
                      or ""
                  ).strip()

                  if not url.startswith(("http://", "https://")):
                      continue

                  media_type = child.attrib.get("type", "").lower()

                  if tag in ("thumbnail", "image"):
                      return url

                  if tag == "enclosure" and media_type.startswith("image/"):
                      return url

                  if tag == "content" and (
                      "media" in child.tag.lower()
                      or media_type.startswith("image/")
                  ):
                      return url

              # Si no hay imagen declarada, busca una en la descripción.
              for child in element.iter():
                  if local(child.tag) not in (
                      "description", "summary", "encoded", "content"
                  ):
                      continue

                  raw = ET.tostring(child, encoding="unicode")
                  match = re.search(
                      r'<img[^>]+(?:src|url)=["\']([^"\']+)["\']',
                      raw,
                      re.IGNORECASE
                  )

                  if match:
                      url = html.unescape(match.group(1))
                      if url.startswith(("http://", "https://")):
                          return url

              return ""

          def parse_feed(data):
              root = ET.fromstring(data)
              articles = []

              for element in root.iter():
                  if local(element.tag) not in ("item", "entry"):
                      continue

                  title = child_text(element, {"title"})
                  link = ""

                  for child in element:
                      if local(child.tag) != "link":
                          continue

                      candidate = (
                          child.attrib.get("href")
                          or child.text
                          or ""
                      ).strip()

                      rel = child.attrib.get("rel", "alternate").lower()

                      if candidate and (
                          not link or rel == "alternate"
                      ):
                          link = candidate

                      if link and rel == "alternate":
                          break

                  if not link:
                      link = child_text(element, {"guid", "id"})

                  if title and link.startswith(("http://", "https://")):
                      article = {
                          "t": html.unescape(title),
                          "l": link
                      }

                      image_url = find_image(element)
                      if image_url:
                          article["img"] = image_url

                      articles.append(article)

              # Evita repetir una misma noticia.
              unique = []
              seen = set()

              for article in articles:
                  if article["l"] not in seen:
                      seen.add(article["l"])
                      unique.append(article)

              return unique

          def traducir(texto, idioma):
              url = (
                  "https://translate.googleapis.com/translate_a/single"
                  "?client=gtx&sl={}&tl=es&dt=t&q={}"
              ).format(
                  idioma,
                  urllib.parse.quote(texto)
              )

              data = json.loads(get(url, timeout=15).decode("utf-8"))
              return "".join(
                  part[0]
                  for part in data[0]
                  if part and part[0]
              )

          resultado = {
              "updated": datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "paises": []
          }

          for pais_config in PAISES:
              pais = {
                  "id": pais_config["id"],
                  "nombre": pais_config["nombre"],
                  "fuentes": []
              }

              for fuente_config in pais_config["fuentes"]:
                  fuente = {
                      "n": fuente_config["n"],
                      "tr": bool(fuente_config.get("tr")),
                      "items": []
                  }

                  try:
                      contenido = get(fuente_config["f"])
                      noticias = parse_feed(contenido)

                      if not noticias:
                          raise ValueError("El RSS no contiene noticias reconocibles")

                      for noticia in noticias[:POR_FUENTE]:
                          articulo = dict(noticia)

                          if fuente_config.get("tr"):
                              try:
                                  original = articulo["t"]
                                  traducida = traducir(
                                      original,
                                      fuente_config["tr"]
                                  )

                                  if traducida:
                                      articulo["t"] = traducida
                                      articulo["o"] = original

                              except Exception as error_traduccion:
                                  print(
                                      "AVISO traducción",
                                      fuente_config["n"],
                                      str(error_traduccion)[:150]
                                  )

                          fuente["items"].append(articulo)

                      print(
                          "OK",
                          fuente_config["n"],
                          "-",
                          len(fuente["items"]),
                          "noticias"
                      )

                  except Exception as error:
                      fuente["error"] = str(error)[:200]
                      print(
                          "ERROR",
                          fuente_config["n"],
                          "-",
                          repr(error)[:250]
                      )

                  pais["fuentes"].append(fuente)

              resultado["paises"].append(pais)

          with open("news.json", "w", encoding="utf-8") as archivo:
              json.dump(
                  resultado,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )

          print("Archivo news.json generado correctamente.")
          PY

      - name: Guardar y subir noticias
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"

          # Reintenta si GitHub recibió cambios mientras se generaban las noticias.
          for intento in 1 2 3; do
            echo "Intento de subida: $intento"

            git fetch origin main
            git reset --mixed origin/main
            git add news.json

            if git diff --cached --quiet; then
              echo "No hay cambios nuevos para subir."
              exit 0
            fi

            git commit -m "Actualizar noticias"

            if git push origin HEAD:main; then
              echo "Noticias subidas correctamente."
              exit 0
            fi

            echo "La subida falló; se volverá a intentar."
            sleep 2
          done

          echo "No se pudieron subir las noticias después de 3 intentos."
          exit 1
