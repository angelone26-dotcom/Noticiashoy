name: Actualizar noticias

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y procesar noticias
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import html
          import datetime
          import re
          import xml.etree.ElementTree as ET
          from urllib.parse import urljoin, urlparse

          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36"
          )
          POR_FUENTE = 8

          PAISES = [
              {
                  "id": "uy",
                  "nombre": "🇺🇾 Uruguay",
                  "fuentes": [
                      {
                          "n": "Montevideo Portal",
                          "f": "https://www.montevideo.com.uy/anxml.aspx?58"
                      },
                      {
                          "n": "El Observador",
                          "f": "https://www.elobservador.com.uy/rss/pages/home.xml"
                      },
                      {
                          "n": "la diaria",
                          "f": "https://ladiaria.com.uy/feeds/articulos"
                      },
                      {
                          "n": "Teledoce",
                          "f": "https://www.teledoce.com/feed/"
                      }
                  ]
              },
              {
                  "id": "ar",
                  "nombre": "🇦🇷 Argentina",
                  "fuentes": [
                      {
                          "n": "Clarín",
                          "f": "https://www.clarin.com/rss/lo-ultimo/"
                      },
                      {
                          "n": "La Nación",
                          "f": "https://www.lanacion.com.ar/arc/outboundfeeds/rss/?outputType=xml"
                      },
                      {
                          "n": "Página/12",
                          "f": "https://www.pagina12.com.ar/arc/outboundfeeds/rss/portada"
                      }
                  ]
              },
              {
                  "id": "br",
                  "nombre": "🇧🇷 Brasil",
                  "fuentes": [
                      {
                          "n": "G1",
                          "f": "https://g1.globo.com/rss/g1/",
                          "tr": "pt"
                      },
                      {
                          "n": "Folha de S.Paulo",
                          "f": "https://feeds.folha.uol.com.br/emcimadahora/rss091.xml",
                          "tr": "pt"
                      },
                      {
                          "n": "UOL",
                          "f": "http://rss.home.uol.com.br/index.xml",
                          "tr": "pt"
                      }
                  ]
              },
              {
                  "id": "es",
                  "nombre": "🇪🇸 España",
                  "fuentes": [
                      {
                          "n": "El País · España",
                          "f": "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada"
                      },
                      {
                          "n": "BBC Mundo",
                          "f": "https://feeds.bbci.co.uk/mundo/rss.xml"
                      }
                  ]
              },
              {
                  "id": "us",
                  "nombre": "🇺🇸 Estados Unidos",
                  "fuentes": [
                      {
                          "n": "The New York Times",
                          "f": "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml",
                          "tr": "en"
                      },
                      {
                          "n": "NPR",
                          "f": "https://feeds.npr.org/1001/rss.xml",
                          "tr": "en"
                      }
                  ]
              }
          ]

          def get(url, timeout=20):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/rss+xml, application/xml, "
                                "text/xml, application/atom+xml, */*"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def local(tag):
              return tag.rsplit("}", 1)[-1].lower()

          def safe_http_url(value, base=""):
              if not value:
                  return ""
              value = html.unescape(value.strip())
              value = urljoin(base, value) if base else value
              parsed = urlparse(value)
              if parsed.scheme not in ("http", "https"):
                  return ""
              return value

          def find_image(item, article_url):
              # Primero busca campos de imagen propios del RSS.
              for node in item.iter():
                  tag = local(node.tag)
                  candidate = ""

                  if tag in ("thumbnail", "content", "image"):
                      candidate = (
                          node.attrib.get("url")
                          or node.attrib.get("href")
                          or ""
                      )

                  elif tag == "enclosure":
                      mime = node.attrib.get("type", "").lower()
                      candidate = node.attrib.get("url", "")
                      if mime and not mime.startswith("image/"):
                          candidate = ""

                  if candidate:
                      candidate = safe_http_url(candidate, article_url)
                      if candidate:
                          return candidate

              # Si no hay campo de imagen, busca una etiqueta img
              # dentro de la descripción o del contenido HTML del RSS.
              for node in item.iter():
                  if local(node.tag) not in (
                      "description", "encoded", "summary", "content"
                  ):
                      continue

                  raw = html.unescape("".join(node.itertext()))
                  match = re.search(
                      r'<img\b[^>]*?\b(?:src|data-src)=["\']([^"\']+)["\']',
                      raw,
                      re.IGNORECASE
                  )
                  if match:
                      candidate = safe_http_url(match.group(1), article_url)
                      if candidate:
                          return candidate

              return ""

          def parse_feed(data):
              root = ET.fromstring(data)
              results = []
              seen = set()

              for item in root.iter():
                  if local(item.tag) not in ("item", "entry"):
                      continue

                  title = ""
                  link = ""

                  for child in item:
                      tag = local(child.tag)

                      if tag == "title" and not title:
                          title = "".join(child.itertext()).strip()

                      elif tag == "link":
                          href = child.attrib.get("href", "")
                          rel = child.attrib.get("rel", "alternate")
                          candidate = href or (child.text or "").strip()

                          if candidate and (
                              not link or rel == "alternate"
                          ):
                              link = candidate

                  title = html.unescape(re.sub(r"\s+", " ", title)).strip()
                  link = safe_http_url(link)

                  if not title or not link or link in seen:
                      continue

                  seen.add(link)
                  results.append({
                      "t": title,
                      "l": link,
                      "img": find_image(item, link)
                  })

              return results

          def translate(text, source_language):
              query = urllib.parse.urlencode({
                  "client": "gtx",
                  "sl": source_language,
                  "tl": "es",
                  "dt": "t",
                  "q": text
              })
              url = (
                  "https://translate.googleapis.com/translate_a/single?"
                  + query
              )
              response = json.loads(get(url, timeout=12).decode("utf-8"))
              return "".join(
                  part[0] for part in response[0]
                  if part and part[0]
              ).strip()

          updated = datetime.datetime.now(
              datetime.timezone.utc
          ).strftime("%Y-%m-%dT%H:%M:%SZ")

          resultado = {
              "updated": updated,
              "paises": []
          }

          for country in PAISES:
              pais = {
                  "id": country["id"],
                  "nombre": country["nombre"],
                  "fuentes": []
              }

              for source in country["fuentes"]:
                  fuente = {
                      "n": source["n"],
                      "tr": bool(source.get("tr")),
                      "items": []
                  }

                  try:
                      items = parse_feed(get(source["f"]))[:POR_FUENTE]

                      if not items:
                          raise ValueError("El RSS no devolvió noticias")

                      for item in items:
                          if source.get("tr"):
                              try:
                                  original = item["t"]
                                  translated = translate(
                                      original, source["tr"]
                                  )
                                  if translated:
                                      item["t"] = translated
                                      item["o"] = original
                              except Exception as error:
                                  print(
                                      "AVISO traducción",
                                      source["n"],
                                      str(error)[:120]
                                  )

                          fuente["items"].append(item)

                      print(
                          "OK",
                          source["n"],
                          "-",
                          len(fuente["items"]),
                          "noticias"
                      )

                  except Exception as error:
                      print(
                          "ERROR",
                          source["n"],
                          "-",
                          repr(error)[:250]
                      )
                      fuente["error"] = str(error)[:160]

                  # Se guarda la fuente aunque haya fallado para poder
                  # diagnosticarla en Actions. La web oculta las vacías.
                  pais["fuentes"].append(fuente)

              resultado["paises"].append(pais)

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(
                  resultado,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Archivo news.json generado correctamente.")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar noticias"
            git push
          else
            echo "No hubo cambios en las noticias."
          fi
