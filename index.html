
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101722">
<title>Noticias del mundo</title>

<style>
:root {
  --bg: #101722;
  --panel: #192332;
  --card: #1d2939;
  --text: #f1f5f9;
  --muted: #a3b1c4;
  --accent: #68e0c0;
  --border: #304055;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(16, 23, 34, .96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.top {
  max-width: 1450px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

h1 {
  font-size: 22px;
  margin: 0;
  letter-spacing: -.5px;
}

.logo { color: var(--accent); }

#upd {
  color: var(--muted);
  font-size: 12px;
  margin-left: auto;
}

.controls {
  max-width: 1450px;
  margin: 14px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

button {
  font: inherit;
  font-size: 13px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 8px 13px;
  border-radius: 9px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}

button:hover { border-color: var(--accent); }

button.on {
  background: var(--accent);
  color: #10201f;
  border-color: var(--accent);
  font-weight: 700;
}

.control-label {
  color: var(--muted);
  font-size: 12px;
  margin-right: 2px;
}

main {
  max-width: 1450px;
  margin: auto;
  padding: 22px 20px 50px;
}

.section-title {
  font-size: 18px;
  margin: 26px 0 14px;
  letter-spacing: -.3px;
}

.section-title:first-child { margin-top: 0; }

.section-subtitle {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  margin-left: 7px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  align-items: stretch;
}

.news-card {
  min-width: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .15s, border-color .15s;
}

.news-card:hover {
  transform: translateY(-2px);
  border-color: #60758f;
}

.media {
  width: 100%;
  height: 155px;
  flex: 0 0 155px;
  overflow: hidden;
  background: #263649;
}

.media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.media.no-image {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #91a5bc;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #26384c, #192535);
}

.card-content {
  padding: 13px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 9px;
}

.source {
  font-size: 11px;
  color: var(--accent);
  font-weight: 750;
  letter-spacing: .2px;
}

.tag {
  font-size: 10px;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 5px;
}

.headline {
  font-size: 15px;
  line-height: 1.45;
  font-weight: 650;
  margin: 0;
  overflow-wrap: anywhere;
}

.headline a {
  color: var(--text);
  text-decoration: none;
}

.headline a:hover { color: var(--accent); }

.original {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
  margin-top: 8px;
}

.open-link {
  display: inline-block;
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  text-decoration: none;
  margin-top: auto;
  padding-top: 13px;
}

.empty, .msg {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  padding: 22px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
}

footer {
  max-width: 1450px;
  margin: auto;
  padding: 0 20px 24px;
  color: var(--muted);
  font-size: 11px;
}

@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 760px) {
  header { padding: 12px; }
  .top, .controls { gap: 8px; }
  h1 { font-size: 20px; }
  #upd { margin-left: 0; width: 100%; }
  main { padding: 18px 12px 35px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .media { height: 125px; flex-basis: 125px; }
  .card-content { padding: 10px; }
  .headline { font-size: 13px; }
  .section-title { font-size: 16px; }
  button { padding: 7px 10px; }
}

@media (max-width: 420px) {
  .grid { grid-template-columns: 1fr; }
  .media { height: 180px; flex-basis: 180px; }
  .headline { font-size: 15px; }
}
</style>
</head>

<body>
<header>
  <div class="top">
    <h1><span class="logo">◈</span> Noticias del mundo</h1>
    <span id="upd">Cargando noticias…</span>
  </div>

  <div class="controls" id="country-controls">
    <span class="control-label">PAÍS</span>
  </div>

  <div class="controls" id="view-controls">
    <span class="control-label">VISTA</span>
  </div>
</header>

<main id="app">
  <p class="msg">Cargando noticias…</p>
</main>

<footer>
  Noticias recopiladas de medios públicos. Al seleccionar un titular, se abre la publicación original.
</footer>

<script>
const $ = s => document.querySelector(s);

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

let DATA = null;
let actual = "all";
let vista = "mix";

function safeUrl(value) {
  try {
    const u = new URL(value);
    return ["https:", "http:"].includes(u.protocol) ? u.href : "";
  } catch {
    return "";
  }
}

function hace(fecha) {
  const d = new Date(fecha);
  if (Number.isNaN(d.getTime())) return "";

  const m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
  if (m < 1) return "recién";
  if (m < 60) return "hace " + m + " min";

  const h = Math.round(m / 60);
  return h < 24 ? "hace " + h + " h" : "hace " + Math.round(h / 24) + " d";
}

function paisesVisibles() {
  return DATA.paises.filter(p => actual === "all" || p.id === actual);
}

function fuentesDe(p) {
  return (p.fuentes || []).filter(s => (s.items || []).length > 0);
}

/* Intercala titulares de diferentes medios. */
function mezclarFuentes(fuentes) {
  const salida = [];
  const max = Math.max(0, ...fuentes.map(s => (s.items || []).length));

  for (let i = 0; i < max; i++) {
    fuentes.forEach(s => {
      const item = (s.items || [])[i];
      if (item) salida.push({ item, fuente: s });
    });
  }

  return salida;
}

function todosLosArticulos(paises) {
  return paises.flatMap(p =>
    mezclarFuentes(fuentesDe(p)).map(n => ({ ...n, pais: p }))
  );
}

function crearControles() {
  const country = $("#country-controls");
  country.innerHTML = '<span class="control-label">PAÍS</span>';

  const opciones = [{ id: "all", nombre: "Todo" }, ...DATA.paises];

  opciones.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.nombre.replace(" (traducido)", "");
    b.className = p.id === actual ? "on" : "";
    b.onclick = () => {
      actual = p.id;
      crearControles();
      render();
    };
    country.append(b);
  });

  const view = $("#view-controls");
  view.innerHTML = '<span class="control-label">ORGANIZAR</span>';

  [
    { id: "mix", label: "Todo mezclado" },
    { id: "country", label: "Por país" },
    { id: "source", label: "Por diario" }
  ].forEach(v => {
    const b = document.createElement("button");
    b.textContent = v.label;
    b.className = v.id === vista ? "on" : "";
    b.onclick = () => {
      vista = v.id;
      crearControles();
      render();
    };
    view.append(b);
  });
}

function tarjeta(n, pais) {
  const i = n.item;
  const s = n.fuente;
  const link = safeUrl(i.l);
  const img = safeUrl(i.img || i.image || i.image_url || i.thumbnail || i.imagen);
  const titulo = esc(i.t || "Noticia sin título");
  const nombreFuente = esc(s.n || "Medio");
  const nombrePais = esc((pais || n.pais || {}).nombre || "");
  const original = i.o
    ? `<div class="original">Original: ${esc(i.o)}</div>`
    : "";
  const traduccion = s.tr ? '<span class="tag">Traducido</span>' : "";

  let media;
  if (img) {
    media = `<div class="media"><img src="${esc(img)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('no-image');this.parentElement.innerHTML='📰'"></div>`;
  } else {
    const inicial = esc((s.n || "N").trim().slice(0, 1).toUpperCase());
    media = `<div class="media no-image">${inicial}</div>`;
  }

  const titular = link
    ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${titulo}</a>`
    : titulo;

  return `
    <article class="news-card">
      ${media}
      <div class="card-content">
        <div class="meta">
          <span class="source">${nombreFuente}</span>
          ${traduccion}
        </div>
        <h3 class="headline">${titular}</h3>
        ${original}
        ${link ? `<a class="open-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Leer noticia ↗</a>` : ""}
      </div>
    </article>`;
}

function grilla(noticias, pais) {
  if (!noticias.length) return "";
  return `<div class="grid">${noticias.map(n => tarjeta(n, pais)).join("")}</div>`;
}

function render() {
  const paises = paisesVisibles();
  let html = "";

  if (vista === "mix") {
    const noticias = todosLosArticulos(paises);
    html = grilla(noticias) ||
      '<p class="empty">No hay noticias disponibles para esta selección.</p>';
  }

  if (vista === "country") {
    paises.forEach(p => {
      const noticias = mezclarFuentes(fuentesDe(p)).map(n => ({ ...n, pais: p }));
      if (!noticias.length) return;

      html += `<section>
        <h2 class="section-title">${esc(p.nombre)}</h2>
        ${grilla(noticias, p)}
      </section>`;
    });
  }

  if (vista === "source") {
    paises.forEach(p => {
      let secciones = "";

      fuentesDe(p).forEach(s => {
        const noticias = (s.items || []).map(item => ({ item, fuente: s, pais: p }));
        secciones += `
          <section>
            <h3 class="section-title">${esc(s.n)}
              ${s.tr ? '<span class="section-subtitle">Traducido al español</span>' : ""}
            </h3>
            ${grilla(noticias, p)}
          </section>`;
      });

      if (secciones) {
        html += `<section>
          <h2 class="section-title">${esc(p.nombre)}</h2>
          ${secciones}
        </section>`;
      }
    });
  }

  if (!html) {
    html = '<p class="empty">Por ahora no hay noticias disponibles. Probá con otro país o volvé a cargar más tarde.</p>';
  }

  $("#app").innerHTML = html;
}

fetch("news.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("Todavía no se generó news.json");
    return r.json();
  })
  .then(d => {
    DATA = d;
    $("#upd").textContent = "Actualizado " + (hace(d.updated) || "recientemente");
    crearControles();
    render();
  })
  .catch(() => {
    $("#app").innerHTML = `
      <p class="msg">
        No se pudieron cargar las noticias. Revisá que la acción de GitHub
        haya terminado correctamente y que exista el archivo news.json.
      </p>`;
    $("#upd").textContent = "Sin conexión con las noticias";
  });
</script>
</body>
</html>
