<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias del mundo</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--ac:#0b5fff;--bd:#e3e3df}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--tx:#ececec;--mu:#9a9a9a;--ac:#6ea0ff;--bd:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#upd{color:var(--mu);font-size:12px;margin-left:auto}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:24px 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:7px 0;border-top:1px solid var(--bd);font-size:14px;line-height:1.35}
.card li:first-child{border-top:0}
a{color:var(--tx);text-decoration:none}a:hover{color:var(--ac)}
.o{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.err,.msg{color:var(--mu);font-size:13px}
.tag{font-size:11px;color:var(--mu);font-weight:400}
</style>
</head>
<body>
<header>
  <h1>📰 Noticias</h1>
  <span id="tabs"></span>
  <span id="upd"></span>
</header>
<main id="app"><p class="msg">Cargando…</p></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA = null, actual = "all";

function hace(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "recién";
  if (m < 60) return "hace " + m + " min";
  const h = Math.round(m / 60);
  return h < 24 ? "hace " + h + " h" : "hace " + Math.round(h / 24) + " d";
}

function tabs(){
  const all = [{id:"all", nombre:"Todo"}, ...DATA.paises];
  $("#tabs").innerHTML = "";
  all.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.nombre.replace(" (traducido)", "");
    if (p.id === actual) b.className = "on";
    b.onclick = () => { actual = p.id; tabs(); render(); };
    $("#tabs").append(b, " ");
  });
}

function render(){
  let h = "";
  DATA.paises.filter(p => actual === "all" || p.id === actual).forEach(p => {
    h += `<h2>${esc(p.nombre)}</h2><div class="grid">`;
    p.fuentes.forEach(s => {
      h += `<div class="card"><h3>${esc(s.n)} ${s.tr ? '<span class="tag">· traducido</span>' : ""}</h3><ul>`;
      if (s.items.length){
        s.items.forEach(i => {
          h += `<li><a href="${esc(i.l)}" target="_blank" rel="noopener">${esc(i.t)}</a>${i.o ? `<span class="o">${esc(i.o)}</span>` : ""}</li>`;
        });
      } else {
        h += `<li class="err">No disponible por ahora${s.error ? " (" + esc(s.error) + ")" : ""}.</li>`;
      }
      h += "</ul></div>";
    });
    h += "</div>";
  });
  $("#app").innerHTML = h;
}

fetch("news.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("no hay news.json todavía"); return r.json(); })
  .then(d => { DATA = d; $("#upd").textContent = "Actualizado " + hace(d.updated); tabs(); render(); })
  .catch(e => { $("#app").innerHTML = `<p class="msg">Todavía no hay noticias (${esc(e.message)}). Esperá a que termine la primera ejecución en la pestaña Actions de GitHub y recargá.</p>`; });
</script>
</body>
</html>
