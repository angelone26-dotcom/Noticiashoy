
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias Hoy</title>
<style>
:root {
  --bg:#0b1120; --panel:#131d30; --panel2:#19263b;
  --line:#29374c; --text:#edf3fb; --muted:#91a1b8;
  --accent:#70e1bd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header,main{max-width:1500px;margin:auto}
header{padding:25px 24px 17px}
main{padding:0 24px 40px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{display:grid;place-items:center;width:43px;height:43px;
  border-radius:13px;background:var(--accent);color:#08231c;font-size:24px}
h1{font-size:clamp(25px,4vw,36px);letter-spacing:-1px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:5px}
.updated{color:var(--muted);font-size:12px}
.countries{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px}
.country-btn,.back-btn,.refresh{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;font-size:13px
}
.country-btn.active{background:var(--accent);color:#09271f;border-color:var(--accent);font-weight:750}
.country-btn:hover,.back-btn:hover,.refresh:hover{border-color:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:22px 0 14px;flex-wrap:wrap}
.toolbar h2{font-size:18px;margin:0}
.count{color:var(--muted);font-size:12px}
.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;align-items:stretch}
.source-card{height:340px;min-width:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:15px}
.source-head{padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:49px}
.source-name{color:var(--text);font-size:13px;font-weight:750;overflow-wrap:anywhere}
.source-open{background:none;border:0;color:var(--accent);font-size:11px;
  cursor:pointer;white-space:nowrap;padding:5px 0 5px 5px}
.source-open:hover{text-decoration:underline}
.source-content{padding:10px;flex:1;min-height:0;overflow:hidden}
.feature-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px;min-height:0}
.feature-story{min-width:0;min-height:0;display:flex;flex-direction:column;
  overflow:hidden;background:var(--panel2);border-radius:10px}
.feature-image-link{display:block;height:125px;flex:0 0 125px;background:#202e43;overflow:hidden}
.feature-image{display:block;width:100%;height:100%;object-fit:cover}
.feature-title{padding:9px;color:var(--text);font-size:12px;line-height:1.4;
  font-weight:700;text-decoration:none;overflow:hidden}
.side-headlines{display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0;overflow:hidden}
.headline{display:block;flex:1;min-height:0;overflow:hidden;padding:8px;
  border:1px solid var(--line);border-radius:8px;color:#dce6f4;
  text-decoration:none;font-size:11px;line-height:1.4;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5}
.headline:hover,.compact-link:hover,.feature-title:hover{color:var(--accent)}
.compact-list{height:100%;overflow:hidden;display:flex;flex-direction:column}
.compact-item{padding:9px 2px;border-bottom:1px solid var(--line);min-height:0}
.compact-item:last-child{border-bottom:0}
.compact-link{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
  overflow:hidden;color:#dce6f4;text-decoration:none;font-size:12px;line-height:1.4}
.more-link{display:block;text-align:center;padding:9px;color:var(--accent);
  font-size:11px;text-decoration:none;border-top:1px solid var(--line)}
.more-link:hover{text-decoration:underline}
.detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.detail-head{padding:17px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detail-head h3{margin:0;font-size:19px}
.detail-list{padding:8px 17px}
.detail-item{padding:13px 0;border-bottom:1px solid var(--line)}
.detail-item:last-child{border-bottom:0}
.detail-item a{color:var(--text);font-size:14px;line-height:1.5;text-decoration:none}
.detail-item a:hover{color:var(--accent)}
.empty{padding:25px;color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:0 20px 24px}
@media(max-width:1050px){.news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){
 header{padding:20px 14px 15px}main{padding:0 14px 30px}
 .news-grid{grid-template-columns:1fr;gap:12px}
 .source-card{height:325px}
 .feature-image-link{height:118px;flex-basis:118px}
 .countries{gap:7px}
 .country-btn{padding:9px 11px}
}
</style>
</head>
<body>
<header>
  <div class="topline">
    <div class="brand">
      <div class="brand-icon">◈</div>
      <div>
        <h1>Noticias Hoy</h1>
        <div class="subtitle">Las noticias, en un solo lugar.</div>
      </div>
    </div>
    <div class="updated" id="updated">Cargando noticias…</div>
  </div>
  <nav class="countries" id="countries" aria-label="Elegir país"></nav>
</header>

<main>
  <div class="toolbar">
    <h2 id="sectionTitle">Últimas noticias</h2>
    <span class="count" id="count"></span>
  </div>
  <div id="newsContainer"></div>
</main>
<footer>Noticias Hoy · Fuentes periodísticas originales</footer>

<script>
const container=document.getElementById("newsContainer");
const countriesNav=document.getElementById("countries");
const sectionTitle=document.getElementById("sectionTitle");
const count=document.getElementById("count");
const updated=document.getElementById("updated");

let data=null;
let selectedCountry="all";
let selectedSource=null;

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function linkOf(item){
 try{
  const u=new URL(item?.l||item?.link||item?.url||"#",location.href);
  return ["http:","https:"].includes(u.protocol)?u.href:"#";
 }catch{return "#";}
}
function imageOf(item){
 const raw=item?.img||item?.image||item?.image_url||item?.thumbnail||
           item?.imagen||item?.imageUrl||"";
 try{
  const u=new URL(raw,location.href);
  return raw&&["http:","https:"].includes(u.protocol)?u.href:"";
 }catch{return "";}
}
function titleOf(item){return String(item?.t||item?.title||"Noticia sin título").trim();}
function sources(){
 const out=[];
 for(const country of data?.paises||[]){
  for(const s of country.fuentes||[]){
   const items=(s.items||[]).filter(i=>titleOf(i));
   if(items.length)out.push({
    id:country.id||"",country:country.nombre||"Otros",
    name:s.n||s.nombre||"Medio",translated:!!s.tr,items
   });
  }
 }
 return out;
}
function getFiltered(){
 return sources().filter(s=>selectedCountry==="all"||s.id===selectedCountry);
}
function renderCountries(){
 const list=[{id:"all",nombre:"🌎 Todos"},...(data?.paises||[])];
 countriesNav.innerHTML=list.map(c=>`
  <button class="country-btn ${selectedCountry===c.id?"active":""}"
   data-country="${esc(c.id)}">${esc(c.nombre)}</button>
 `).join("");
 countriesNav.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click",()=>{
   selectedCountry=btn.dataset.country;
   selectedSource=null;
   render();
  });
 });
}
function compactItem(item){
 return `<div class="compact-item">
  <a class="compact-link" href="${linkOf(item)}" target="_blank" rel="noopener noreferrer">
   ${esc(titleOf(item))}
  </a>
 </div>`;
}
function card(source){
 const items=source.items;
 const featuredIndex=items.findIndex(i=>imageOf(i));
 const featured=featuredIndex>=0?items[featuredIndex]:null;
 let body="";

 if(featured){
  const remaining=items.filter((_,i)=>i!==featuredIndex);
  const side=remaining.slice(0,3);
  const img=imageOf(featured);
  body=`<div class="feature-layout">
   <div class="feature-story">
    <a class="feature-image-link" href="${linkOf(featured)}" target="_blank" rel="noopener noreferrer">
     <img class="feature-image" src="${esc(img)}" alt="" loading="lazy"
      onerror="this.closest('.source-card').querySelector('.source-content').innerHTML =
       '<div class=&quot;compact-list&quot;>${esc(items.slice(0,4).map(i=>titleOf(i)).join(" • ")).replace(/'/g,"&#39;")}</div>';">
    </a>
    <a class="feature-title" href="${linkOf(featured)}" target="_blank" rel="noopener noreferrer">
     ${esc(titleOf(featured))}
    </a>
   </div>
   <div class="side-headlines">
    ${side.map(i=>`<a class="headline" href="${linkOf(i)}" target="_blank" rel="noopener noreferrer">${esc(titleOf(i))}</a>`).join("")}
   </div>
  </div>`;
 }else{
  body=`<div class="compact-list">${items.slice(0,5).map(compactItem).join("")}</div>`;
 }

 return `<article class="source-card">
  <div class="source-head">
   <span class="source-name">${esc(source.name)}${source.translated?" · traducido":""}</span>
   <button class="source-open" data-source="${esc(source.id+"::"+source.name)}">Ver todas →</button>
  </div>
  <div class="source-content">${body}</div>
 </article>`;
}
function openSource(key){
 selectedSource=key;
 render();
}
function detail(source){
 return `<section class="detail-panel">
  <div class="detail-head">
   <h3>${esc(source.name)}${source.translated?" · traducido":""}</h3>
   <button class="back-btn" id="backBtn">← Volver a la cuadrícula</button>
  </div>
  <div class="detail-list">
   ${source.items.map((item,i)=>`<div class="detail-item">
    <a href="${linkOf(item)}" target="_blank" rel="noopener noreferrer">
     ${i+1}. ${esc(titleOf(item))}
    </a>
   </div>`).join("")}
  </div>
 </section>`;
}
function render(){
 renderCountries();
 const list=getFiltered();
 const total=list.reduce((n,s)=>n+s.items.length,0);
 count.textContent=`${total} noticias · ${list.length} medios`;

 if(selectedSource){
  const source=list.find(s=>s.id+"::"+s.name===selectedSource);
  if(source){
   sectionTitle.textContent=source.name;
   container.innerHTML=detail(source);
   document.getElementById("backBtn").addEventListener("click",()=>{
    selectedSource=null;render();
   });
   return;
  }
  selectedSource=null;
 }
 sectionTitle.textContent=selectedCountry==="all"?"Últimas noticias":
  (data.paises.find(c=>c.id===selectedCountry)?.nombre||"Noticias");

 if(!list.length){
  container.innerHTML='<div class="empty">No hay noticias disponibles.</div>';
  return;
 }
 container.innerHTML=`<div class="news-grid">${list.map(card).join("")}</div>`;
 container.querySelectorAll(".source-open").forEach(btn=>{
  btn.addEventListener("click",()=>openSource(btn.dataset.source));
 });
}
async function load(){
 try{
  const response=await fetch("./news.json?ts="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("Error al cargar noticias");
  data=await response.json();
  if(data.updated){
   const date=new Date(data.updated);
   updated.textContent="Actualizado: "+(isNaN(date.getTime())?data.updated:date.toLocaleString("es-UY"));
  }else updated.textContent="Noticias desde RSS";
  render();
 }catch(e){
  container.innerHTML='<div class="empty">No se pudieron cargar las noticias. Volvé a intentar en unos segundos.</div>';
  updated.textContent="Error al cargar";
  console.error(e);
 }
}
load();
</script>
</body>
</html>
